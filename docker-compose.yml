services:
  db:
    image: postgres:16-alpine
    container_name: election2027-db
    environment:
      POSTGRES_DB: election2027
      POSTGRES_USER: election
      POSTGRES_PASSWORD: election
    ports:
      - "5432:5432"
    volumes:
      - election2027-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U election -d election2027"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  election2027-data:
